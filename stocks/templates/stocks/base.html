<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JStocks{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        (function() {
            // 다크 전용. 저장된 값은 무시한다 (예전에 light를 쓰던 브라우저 대응)
            document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <style>
        :root {
            --bg-page: #f5f6f8;
            --bg-card: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --up-color: #dc3545;
            --down-color: #2962ff;
            /* 투자자별 수급 — 시황·종목·ETF 가 같은 색을 쓴다.
               빨강·파랑은 가격이 이미 가져갔으므로 여기서는 쓰지 않는다.
               예전에 기관이 빨강이라 '기관이 오른 것'처럼 읽혔다. */
            --investor-foreign: #8b5cf6;
            --investor-institution: #f59e0b;
            --investor-individual: #14b8a6;
        }

        [data-theme="dark"] {
            --bg-page: #0f1115;
            --bg-card: #1a1d24;
            --bg-secondary: #22262f;
            --text-primary: #c2c7d0;
            --text-secondary: #8a909b;
            --text-muted: #5f6671;
            --border-color: #2a2e38;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
            --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.5);
            --up-color: #ef5350;
            --down-color: #5b8def;
        }
        [data-theme="dark"] body { color-scheme: dark; }
        [data-theme="dark"] img { filter: brightness(0.9); }

        /* 다크모드: 템플릿 하드코딩 라이트 색상 상쇄 (행 구분선/연한 배경/카드) */
        [data-theme="dark"] .modern-table tbody td,
        [data-theme="dark"] .mobile-stock-item,
        [data-theme="dark"] .edit-list-item,
        [data-theme="dark"] .list-item {
            border-bottom-color: var(--border-color) !important;
        }
        [data-theme="dark"] .modern-table tbody tr:hover,
        [data-theme="dark"] .mobile-stock-item:hover {
            background: #22262f !important;
        }
        [data-theme="dark"] .modern-table tbody tr.price-hit { background: #332a10 !important; }
        [data-theme="dark"] .modal-box { background: var(--bg-card) !important; color: var(--text-primary) !important; }
        [data-theme="dark"] .event-chip { background: #22262f !important; }
        [data-theme="dark"] .event-chip.event-urgent { background: #3a1c1c !important; border-color: #7f1d1d !important; }
        [data-theme="dark"] .event-urgent .event-dday { color: #fca5a5 !important; }
        [data-theme="dark"] .modern-table tbody tr.price-hit:hover { background: #3d3214 !important; }
        [data-theme="dark"] .brief-card,
        [data-theme="dark"] .card-v2 {
            background: var(--bg-card);
            border-color: var(--border-color);
        }
        /* 매우 연한 배경(#f9fafb, #f3f4f6)을 카드 배경으로 매핑 */
        [data-theme="dark"] [style*="background:#f9fafb"],
        [data-theme="dark"] [style*="background: #f9fafb"],
        [data-theme="dark"] [style*="background:#f3f4f6"],
        [data-theme="dark"] [style*="background: #f3f4f6"] {
            background: #22262f !important;
        }
        /* 정보 박스 연한 배경 색들 살짝 어둡게 */
        [data-theme="dark"] [style*="background:#ecfdf5"],
        [data-theme="dark"] [style*="background: #ecfdf5"] { background: #0e2a1f !important; }
        [data-theme="dark"] [style*="background:#fef3c7"],
        [data-theme="dark"] [style*="background: #fef3c7"] { background: #3a2f15 !important; }
        [data-theme="dark"] [style*="background:#fef2f2"],
        [data-theme="dark"] [style*="background: #fef2f2"] { background: #3a1c1c !important; }
        [data-theme="dark"] [style*="background:#fffbeb"],
        [data-theme="dark"] [style*="background: #fffbeb"] { background: #332a10 !important; }
        [data-theme="dark"] [style*="background:#eff6ff"],
        [data-theme="dark"] [style*="background: #eff6ff"] { background: #162338 !important; }
        [data-theme="dark"] [style*="background:#fff3cd"],
        [data-theme="dark"] [style*="background: #fff3cd"] { background: #3a2f15 !important; }
        /* 하드코딩 흰색 배경 → 카드 배경 */
        [data-theme="dark"] [style*="background:#fff"],
        [data-theme="dark"] [style*="background: #fff"],
        [data-theme="dark"] [style*="background:#ffffff"],
        [data-theme="dark"] [style*="background: #ffffff"] {
            background: var(--bg-card) !important;
        }
        /* 부트스트랩 form-control 다크 */
        [data-theme="dark"] .form-control,
        [data-theme="dark"] .form-select,
        [data-theme="dark"] input,
        [data-theme="dark"] textarea,
        [data-theme="dark"] select {
            background-color: #22262f;
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        [data-theme="dark"] .form-control::placeholder,
        [data-theme="dark"] textarea::placeholder,
        [data-theme="dark"] input::placeholder {
            color: var(--text-muted);
        }

        /* 뱃지류 다크 톤다운 (클래스 기반) */
        [data-theme="dark"] .tag-badge.market-kospi,
        [data-theme="dark"] .tag-badge.tracking { background: #1e2e4a !important; color: #93b4ff !important; }
        [data-theme="dark"] .tag-badge.market-kosdaq,
        [data-theme="dark"] .tag-badge.holding,
        [data-theme="dark"] .tag-badge.sector,
        [data-theme="dark"] .status-badge.done { background: #0e2a1f !important; color: #4ade80 !important; }
        [data-theme="dark"] .tag-badge.interest-normal { background: #332a10 !important; color: #fbbf24 !important; }
        [data-theme="dark"] .tag-badge.interest-waiting { background: #22262f !important; color: var(--text-secondary) !important; }
        [data-theme="dark"] .status-badge.pending { background: #22262f !important; color: var(--text-muted) !important; }
        [data-theme="dark"] .status-badge.info { background: #1e2e4a !important; color: #93b4ff !important; }
        [data-theme="dark"] .channel-badge { background: #22262f !important; color: var(--text-secondary) !important; }
        [data-theme="dark"] .prompt-badge { background: #0e2a1f !important; color: #4ade80 !important; }

        /* 마크다운 렌더링 영역 공통 */
        .markdown-content h1 { font-size: 1.3rem; font-weight: 700; margin: 1.2rem 0 0.6rem; padding-bottom: 0.25rem; border-bottom: 2px solid var(--border-color); }
        .markdown-content h2 { font-size: 1.15rem; font-weight: 700; margin: 1rem 0 0.5rem; padding-bottom: 0.2rem; border-bottom: 1px solid var(--border-color); }
        .markdown-content h3 { font-size: 1rem; font-weight: 600; margin: 0.8rem 0 0.4rem; }
        .markdown-content h4 { font-size: 0.92rem; font-weight: 600; margin: 0.6rem 0 0.3rem; }
        .markdown-content p { margin: 0.4rem 0; }
        .markdown-content ul, .markdown-content ol { padding-left: 1.75rem; margin: 0.4rem 0; }
        .markdown-content li { margin: 0.2rem 0; }
        .markdown-content table { width: 100%; border-collapse: collapse; margin: 0.8rem 0; font-size: 0.85rem; }
        .markdown-content th, .markdown-content td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }
        .markdown-content th { background: #f9fafb; font-weight: 600; }
        .markdown-content blockquote { border-left: 4px solid var(--border-color); padding: 0.5rem 1rem; margin: 0.8rem 0; background: #f9fafb; color: var(--text-secondary); }
        .markdown-content code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
        .markdown-content hr { border: none; border-top: 1px solid var(--border-color); margin: 1rem 0; }
        .markdown-content a { color: #2962ff; text-decoration: none; }
        .markdown-content a:hover { text-decoration: underline; }

        /* 마크다운 렌더링 영역 다크 */
        [data-theme="dark"] .markdown-content { color: var(--text-primary); }
        [data-theme="dark"] .markdown-content h1,
        [data-theme="dark"] .markdown-content h2 { border-bottom-color: var(--border-color) !important; }
        [data-theme="dark"] .markdown-content th,
        [data-theme="dark"] .markdown-content td { border-color: var(--border-color) !important; }
        [data-theme="dark"] .markdown-content th { background: #22262f !important; color: var(--text-primary); }
        [data-theme="dark"] .markdown-content tr:hover { background: #22262f !important; }
        [data-theme="dark"] .markdown-content blockquote { background: #22262f !important; color: var(--text-secondary) !important; border-left-color: var(--text-muted) !important; }
        [data-theme="dark"] .markdown-content code { background: #22262f !important; color: #f472b6 !important; }
        [data-theme="dark"] .markdown-content hr { border-top-color: var(--border-color) !important; }
        [data-theme="dark"] .markdown-content a { color: #5b8def !important; }
        /* 다크모드: HTML 인라인 스타일 강제 제거 */
        [data-theme="dark"] .markdown-content *:not(pre):not(code) { background-color: transparent !important; color: var(--text-primary) !important; }
        [data-theme="dark"] .markdown-content a { color: #5b8def !important; }
        [data-theme="dark"] .markdown-content th { background: var(--bg-secondary) !important; }
        [data-theme="dark"] .markdown-content blockquote { background: var(--bg-secondary) !important; color: var(--text-secondary) !important; }
        [data-theme="dark"] .markdown-content code { background: var(--bg-secondary) !important; color: #f472b6 !important; }
        [data-theme="dark"] .markdown-content mark { background: #4a3d10 !important; }

        /* ==하이라이트== */
        mark { background: #fff3bf; color: inherit; padding: 1px 3px; border-radius: 3px; }
        [data-theme="dark"] mark { background: #4a3d10; }

        * { box-sizing: border-box; }
        html { overflow-y: scroll; }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .text-up { color: var(--up-color) !important; }
        /* ── 모달 · 프롬프트 편집 ─────────────────────────────
           시황·종목 등 여러 화면이 같은 창을 쓴다. 설정 화면이 사라지면
           프롬프트는 저마다 쓰이는 자리에서 고치게 되므로 여기 둔다. */
        /* 모달 (index.html 과 같은 규격) */
        .modal-overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.4); z-index:1000; justify-content:center; align-items:center; }
        .modal-overlay.show { display:flex; }
        .modal-box { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius); max-width:900px; width:95%; max-height:85vh; overflow-y:auto; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
        .modal-header-custom { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
        .modal-header-custom h6 { font-size:0.9rem; font-weight:700; color:var(--text-primary); margin:0; }
        .modal-close-btn { background:none; border:none; font-size:1.2rem; color:var(--text-muted); cursor:pointer; padding:4px 8px; line-height:1; }
        .modal-close-btn:hover { color:var(--text-primary); }

        /* 프롬프트 버튼 — 같은 줄의 다른 버튼과 모양을 맞춘다 */
        .mp-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }
        .mp-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .mp-btn-icon { padding: 4px 8px; }

        /* 프롬프트 편집 */
        .mp-vars {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 8px;
        }
        .mp-var {
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-family: inherit;
            cursor: pointer;
        }
        .mp-var:hover { color: var(--text-primary); }
        .mp-var small { color: var(--text-muted); margin-left: 4px; }
        /* 프롬프트 편집 · AI 답변 붙여넣기 입력창 */
        #mpText, #maContent {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.8rem;
            line-height: 1.7;
            resize: vertical;
        }
        #mpText:focus, #maContent:focus {
            outline: none;
            border-color: var(--text-muted);
        }
        /* 프롬프트는 변수와 줄맞춤을 봐야 해서 고정폭 */
        #mpText {
            min-height: 320px;
            font-size: 0.78rem;
            line-height: 1.6;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        #maContent { min-height: 260px; }
        .mp-foot {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .mp-foot .mp-msg { margin-left: auto; font-size: 0.74rem; color: var(--text-muted); }
        .mp-save {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: var(--up-color);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }


        /* 차트 범례 — 시황·종목이 같은 규격을 쓴다.
           Chart.js 기본 범례(네모 상자·아래쪽) 대신 차트 위에 HTML 로 둔다. */
        .chart-legend {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
            font-size: 0.74rem;
            color: var(--text-muted);
        }
        .chart-legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .chart-legend i {
            width: 12px;
            height: 2px;
            border-radius: 1px;
            display: inline-block;
        }
        .chart-legend-val { font-weight: 700; font-variant-numeric: tabular-nums; }
        .chart-legend-muted { color: var(--text-muted); }
        .chart-legend-warn { color: #f59e0b; opacity: 1; }
        .chart-legend-note { margin-left: auto; font-size: 0.7rem; opacity: 0.8; }
        /* 목표가 범위 밴드는 선이 아니라 면이라 조각도 면으로 보인다 */
        .chart-legend i.legend-band {
            height: 8px; background: rgba(220, 53, 69, 0.22);
            border: 1px solid rgba(220, 53, 69, 0.4); border-radius: 2px;
        }

        @media (max-width: 768px) {
            .chart-legend { gap: 10px; font-size: 0.7rem; }
            .chart-legend-note { display: none; }
            .chart-legend-warn { display: inline; }
        }

        /* 프롬프트 짝 — 복사와 편집은 늘 같이 다니므로 한 덩어리로 묶는다.
           채운 버튼은 화면에 이것 하나뿐이다. 빨강·파랑은 가격, 초록·주황·보라는
           이미 배지들이 쓰고 있어서, 색을 하나 더 고르는 대신 '채움'으로 가른다. */
        .prompt-pair {
            display: inline-flex; align-items: stretch; vertical-align: middle;
            border-radius: 6px; overflow: hidden; line-height: 1;
            font-size: 0.72rem; font-weight: 500;
        }
        .prompt-pair > * {
            display: inline-flex; align-items: center;
            background: #1f2937; color: #fff;
            border: none; padding: 5px 10px; cursor: pointer;
            font-size: inherit; font-weight: inherit; font-family: inherit;
            text-decoration: none; white-space: nowrap;
            transition: background 0.15s;
        }
        .prompt-pair > *:hover { background: #374151; }
        /* 둘째 칸(⚙)은 가름선으로만 나눈다. 칸이 하나뿐이어도 모양이 유지된다. */
        .prompt-pair > * + * { border-left: 1px solid rgba(255,255,255,0.22); padding: 5px 8px; }
        /* 표 안처럼 줄이 빽빽한 자리에서는 한 치수 작게 */
        .prompt-pair-sm { font-size: 0.66rem; }
        .prompt-pair-sm > * { padding: 3px 7px; }
        .prompt-pair-sm > * + * { padding: 3px 6px; }
        [data-theme="dark"] .prompt-pair > * { background: #e5e7eb; color: #111827; }
        [data-theme="dark"] .prompt-pair > *:hover { background: #f3f4f6; }
        [data-theme="dark"] .prompt-pair > * + * { border-left-color: rgba(17,24,39,0.22); }


        .text-down { color: var(--down-color) !important; }

        /* Top Navigation */
        .top-nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            text-decoration: none;
            margin-right: 32px;
            padding: 14px 0;
        }
        .nav-brand:hover { color: var(--text-primary); }
        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 0;
        }
        .nav-links a {
            display: block;
            padding: 14px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            min-width: 56px;
            text-align: center;
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a.active {
            color: var(--text-primary);
            font-weight: 500;
            border-bottom-color: var(--text-primary);
        }
        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-right a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            transition: color 0.15s, background 0.15s;
        }
        .nav-right a:hover {
            color: var(--text-primary);
            background: var(--bg-page);
        }
        .nav-logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        /* Content wrapper */
        .content-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Card */
        .card-v2 {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.2s;
        }

        /* Sub navigation (tabs within page) */
        .sub-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0;
        }
        .sub-nav a {
            padding: 10px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .sub-nav a:hover { color: var(--text-primary); }
        .sub-nav a.active {
            color: var(--text-primary);
            font-weight: 600;
            border-bottom-color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .top-nav-inner { padding: 0 8px; }
            .content-wrapper { padding: 16px 12px; }
            .nav-brand { font-size: 0.95rem; margin-right: 12px; padding: 10px 0; }
            .nav-links { gap: 0; }
            .nav-links a { padding: 10px 6px; font-size: 0.75rem; white-space: nowrap; min-width: auto; }
            .nav-right { gap: 2px; }
            .nav-right a, .nav-right button, .nav-logout-btn { font-size: 0.68rem; padding: 4px 6px; }
        }

        /* ⓘ 설명 아이콘 — {% templatetag openblock %} help_icon "키" {% templatetag closeblock %} 로 어느 화면에서든 붙인다 */
        .hlp {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            padding: 0;
            margin-left: 3px;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 0.72rem;
            line-height: 1;
            cursor: pointer;
            vertical-align: middle;
        }
        .hlp:hover { color: var(--text-primary); }
        /* 손가락으로 누를 수 있게 실제 터치 영역만 넓힌다 (레이아웃은 그대로) */
        .hlp::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            margin: -8px;
        }

        .hlp-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1080;
            background: rgba(0, 0, 0, 0.45);
            padding: 20px;
            overflow-y: auto;
        }
        .hlp-overlay.show { display: flex; align-items: center; justify-content: center; }
        .hlp-box {
            width: 100%;
            max-width: 420px;
            padding: 18px 20px 20px;
            border-radius: var(--radius);
            background: var(--bg-card);
            box-shadow: var(--shadow-card-hover);
        }
        .hlp-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .hlp-head h6 { margin: 0; font-size: 0.92rem; font-weight: 700; color: var(--text-primary); }
        .hlp-close {
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
        }
        .hlp-body {
            font-size: 0.8rem;
            line-height: 1.65;
            color: var(--text-secondary);
            white-space: pre-line;
            word-break: keep-all;
        }

        {% block extra_style %}{% endblock %}
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a class="nav-brand" href="{% url 'stocks:index' %}">JStocks</a>
            <ul class="nav-links">
                <li><a href="{% url 'stocks:asset' %}" class="{% if request.resolver_match.url_name == 'asset' %}active{% endif %}">자산</a></li>
                <li><a href="{% url 'stocks:market' %}" class="{% if request.resolver_match.url_name == 'market' %}active{% endif %}">시장</a></li>
                <li><a href="{% url 'stocks:index' %}" class="{% if request.resolver_match.url_name == 'index' or 'stock' in request.resolver_match.url_name %}active{% endif %}">종목</a></li>
                <li><a href="{% url 'stocks:etf' %}" class="{% if request.resolver_match.url_name == 'etf' %}active{% endif %}">ETF</a></li>
            </ul>
            <div class="nav-right">
                <a href="{% url 'stocks:stock_list' %}">목록</a>
                <a href="{% url 'stocks:settings' %}">설정</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-logout-btn" title="로그아웃"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-2px;"><path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/><path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/></svg></button>
                </form>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" style="border-radius: var(--radius-sm);">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <!-- ⓘ 설명 팝업 (모든 화면 공용) -->
    <div class="hlp-overlay" id="helpOverlay">
        <div class="hlp-box">
            <div class="hlp-head">
                <h6 id="helpTitle"></h6>
                <button type="button" class="hlp-close" id="helpClose" aria-label="닫기">&times;</button>
            </div>
            <div class="hlp-body" id="helpBody"></div>
        </div>
    </div>
    <script>
    // 위 CSS 변수와 같은 값. 차트 라이브러리에는 문자열로 넘겨야 해서 한 번 더 적는다.
    const INVESTOR_COLORS = {
        foreign: '#8b5cf6',
        institution: '#f59e0b',
        individual: '#14b8a6',
    };
    </script>
    <script>
    // ⓘ 아이콘은 어느 화면에서든 나중에 추가될 수 있으므로 위임으로 받는다.
    (function () {
        const overlay = document.getElementById('helpOverlay');
        const close = () => overlay.classList.remove('show');
        function open(icon) {
            document.getElementById('helpTitle').textContent = icon.dataset.helpTitle || '';
            document.getElementById('helpBody').textContent = icon.dataset.helpBody || '';
            overlay.classList.add('show');
        }
        // 캡처 단계에서 잡는다. 접기 헤더처럼 누를 수 있는 요소 안에 들어가도
        // 바깥 동작이 같이 일어나지 않게 하기 위해서다.
        document.addEventListener('click', e => {
            const icon = e.target.closest('.hlp');
            if (!icon) return;
            e.preventDefault();
            e.stopPropagation();
            open(icon);
        }, true);
        // span 이라 키보드 조작을 직접 붙여준다
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const icon = e.target.closest && e.target.closest('.hlp');
            if (!icon) return;
            e.preventDefault();
            open(icon);
        });
        document.getElementById('helpClose').addEventListener('click', close);
        overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && overlay.classList.contains('show')) close();
        });
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
