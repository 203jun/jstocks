<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JStocks{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f5f6f8;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --up-color: #dc3545;
            --down-color: #2962ff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .text-up { color: var(--up-color) !important; }
        .text-down { color: var(--down-color) !important; }

        /* Top Navigation */
        .top-nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .top-nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            text-decoration: none;
            margin-right: 32px;
            padding: 14px 0;
        }
        .nav-brand:hover { color: var(--text-primary); }
        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 4px;
        }
        .nav-links a {
            display: block;
            padding: 14px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a.active {
            color: var(--text-primary);
            font-weight: 600;
            border-bottom-color: var(--text-primary);
        }
        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-right a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            transition: color 0.15s, background 0.15s;
        }
        .nav-right a:hover {
            color: var(--text-primary);
            background: var(--bg-page);
        }

        /* Content wrapper */
        .content-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Card */
        .card-v2 {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.2s;
        }

        /* Sub navigation (tabs within page) */
        .sub-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0;
        }
        .sub-nav a {
            padding: 10px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .sub-nav a:hover { color: var(--text-primary); }
        .sub-nav a.active {
            color: var(--text-primary);
            font-weight: 600;
            border-bottom-color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .top-nav-inner { padding: 0 8px; }
            .content-wrapper { padding: 16px 12px; }
            .nav-brand { font-size: 0.95rem; margin-right: 12px; padding: 10px 0; }
            .nav-links { gap: 0; }
            .nav-links a { padding: 10px 8px; font-size: 0.75rem; white-space: nowrap; }
            .nav-right { gap: 2px; }
            .nav-right a, .nav-right button { font-size: 0.75rem; padding: 6px 8px; }
        }

        {% block extra_style %}{% endblock %}
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a class="nav-brand" href="{% url 'stocks:index' %}">JStocks</a>
            <ul class="nav-links">
                <li><a href="{% url 'stocks:market' %}" class="{% if request.resolver_match.url_name == 'market' %}active{% endif %}">시황</a></li>
                <li><a href="{% url 'stocks:sector' %}" class="{% if request.resolver_match.url_name == 'sector' %}active{% endif %}">섹터</a></li>
                <li><a href="{% url 'stocks:index' %}" class="{% if request.resolver_match.url_name == 'index' or 'stock' in request.resolver_match.url_name %}active{% endif %}">종목</a></li>
                <li><a href="{% url 'stocks:etf' %}" class="{% if request.resolver_match.url_name == 'etf' %}active{% endif %}">ETF</a></li>
            </ul>
            <div class="nav-right">
                <a href="{% url 'stocks:settings' %}">설정</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:var(--text-muted);font-size:0.85rem;padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;">로그아웃</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" style="border-radius: var(--radius-sm);">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
