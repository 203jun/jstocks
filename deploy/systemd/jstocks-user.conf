# gunicorn 을 root 가 아닌 전용 계정으로 돌리는 drop-in
#
#   cp deploy/systemd/jstocks-user.conf /etc/systemd/system/jstocks.service.d/user.conf
#   systemctl daemon-reload && systemctl restart jstocks
#
# 이 파일만 복사해서는 안 된다. 계정을 만들고 파일 주인을 넘기는 일이
# 먼저다 — docs/deployment.md 의 '전용 계정으로 내리기' 를 따라간다.
# 순서를 건너뛰면 gunicorn 이 db.sqlite3 를 못 열어 500 이 난다.
#
# bind.conf 와 따로 둔다. 하는 일이 다르고, 한쪽만 되돌릴 일이 생긴다.

[Service]
User=stock
Group=stock

# 왜 root 로 돌리면 안 되는가
#
#   .env 에 키움 증권 계좌의 실거래 API 키가 들어 있다. 장고나 의존 패키지에
#   원격 코드 실행 구멍이 하나 나면, root 로 돌던 프로세스는 그 순간 서버
#   전체를 내준다. 전용 계정이면 넘어가는 것이 /home/stock 안쪽으로 그친다.
#   키가 털리는 것은 어차피 막지 못하지만, 서버를 발판 삼는 것은 막는다.
#
# 왜 ProtectHome·PrivateTmp 같은 것을 더 걸지 않는가
#
#   ProtectHome 은 /home 을 통째로 가린다. 앱이 /home/stock/jstocks 에 있어
#   켜면 바로 죽는다. 나머지 샌드박스 옵션도 하나씩 켜 보며 확인할 수 있을
#   때 더하는 게 맞다. 계정을 내리는 것만으로 가장 큰 것은 덜어진다.
