# gunicorn 을 127.0.0.1 로만 듣게 하는 drop-in
#
#   mkdir -p /etc/systemd/system/jstocks.service.d
#   cp deploy/systemd/jstocks-bind.conf /etc/systemd/system/jstocks.service.d/bind.conf
#   systemctl daemon-reload && systemctl restart jstocks
#
# 되돌리려면
#   rm -rf /etc/systemd/system/jstocks.service.d && systemctl daemon-reload && systemctl restart jstocks
#
# 유닛 파일을 덮어쓰지 않고 drop-in 으로 둔 이유가 둘 있다.
#
#   원본에는 EnvironmentFile 이 없다. 환경변수는 python-decouple 이 .env 를 직접
#   읽어 쓴다. 거기에 EnvironmentFile 을 더하면 systemd 도 같은 파일을 파싱해
#   환경변수로 넣고, decouple 은 환경변수를 먼저 본다. SECRET_KEY 에 $ % ! ^ @ )
#   가 섞여 있어 systemd 가 다르게 해석하면 키가 조용히 달라진다 — 세션이 전부
#   깨진다. 얻을 것이 없는 위험이라 건드리지 않는다.
#
#   원본의 다른 줄(User·Restart 등)을 그대로 두면 내가 모르는 설정을 지울 일이
#   없다. 고치는 것은 ExecStart 하나뿐이다.

[Service]
# 빈 줄로 원래 ExecStart 를 지우고 새로 하나만 둔다. systemd 는 이렇게 쓰지
# 않으면 두 명령을 차례로 돌리려 한다.
ExecStart=
ExecStart=/home/stock/jstocks/venv/bin/gunicorn --bind 127.0.0.1:8000 --workers 1 --timeout 120 jstocks.wsgi:application

# --bind 127.0.0.1
#   예전에는 0.0.0.0:8000 이라 바깥에서 바로 들어왔다. nginx 를 세워도 8000 이
#   열려 있으면 https 를 건너뛰어 평문으로 접속할 수 있고, 그러면 쿠키에 붙은
#   Secure 때문에 CSRF 가 깨진다 — 실제로 :8000 으로 들어가 로그인이 막혔다.
#
# --timeout 120
#   nginx 의 proxy_read_timeout 과 짝이다. 기본 30초로는 DART 를 긁는 요청이
#   먼저 끊긴다.
