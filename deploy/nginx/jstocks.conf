# jstocks — nginx 사이트 설정
#
#   cp deploy/nginx/jstocks.conf /etc/nginx/sites-available/jstocks
#   sed -i 's/YOUR_DOMAIN/실제도메인/g' /etc/nginx/sites-available/jstocks
#   ln -sf /etc/nginx/sites-available/jstocks /etc/nginx/sites-enabled/jstocks
#   nginx -t && systemctl reload nginx
#
# 일부러 http(80) 하나만 둔다.
#
# TLS 는 certbot 이 붙인다 — `certbot --nginx -d 실제도메인` 을 돌리면 이 파일에
# 443 블록과 인증서 경로, http->https 리다이렉트를 알아서 써 넣는다. 여기서
# 443 블록을 미리 적으면 두 가지로 걸린다. 인증서 파일이 아직 없어 nginx -t 가
# 실패하고, ssl 지시어 모양이 nginx 버전마다 달라(1.25 미만은 `http2 on;` 이
# 문법 오류다) 서버마다 손봐야 한다. certbot 이 그 서버의 버전에 맞게 쓴다.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # 리포트 PDF 를 올린다. nginx 기본값은 1m 이라 그대로 두면 업로드가 막힌다.
    client_max_body_size 50m;

    access_log /var/log/nginx/jstocks.access.log;
    error_log  /var/log/nginx/jstocks.error.log;

    # ── 정적 파일 ──
    #
    # 지금은 어느 화면도 Django 의 static 태그를 쓰지 않는다. 이 자리는 admin
    # 화면의 CSS·JS 를 위한 것이다 — 그동안 아무것도 서빙하지 않아 admin 이
    # 맨몸으로 보였다. collectstatic 을 한 번 돌려야 내용이 생긴다.
    location /static/ {
        alias /home/stock/jstocks/staticfiles/;
        access_log off;
        expires 7d;
    }

    # ── 업로드 파일(/media/)은 nginx 가 직접 주지 않는다 ──
    #
    # 내가 올린 리포트 파일이 들어 있고, 지금은 Django 미들웨어가 로그인을
    # 확인해 막는다. 여기에 alias 를 두면 그 확인을 건너뛰어 주소만 알면
    # 누구나 받아간다. 그래서 일부러 location 을 두지 않고 아래로 흘려보낸다.

    # ── 나머지 전부 gunicorn ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 이 줄이 있어야 Django 가 https 요청인 줄 안다.
        # settings 의 BEHIND_TLS_PROXY=True 와 짝이다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # DART 긁기처럼 바깥을 기다리는 화면이 있다. gunicorn 의 --timeout 과
        # 같이 늘려야 한쪽만 먼저 끊지 않는다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── 들어오는 문을 내 쪽에서만 열고 싶을 때 ──
    #
    # certbot 을 돌린 뒤에 주석을 풀고 YOUR_IP 를 바꾼다. 로그인 시도 자체를
    # 막아 주지만, 집 인터넷처럼 IP 가 바뀌는 회선이면 나도 못 들어온다.
    # 고정 IP 이거나 들어올 곳이 정해져 있을 때만 쓴다.
    # /ontoo/ 는 여기 넣지 않는다 — 동료가 보는 자리다.
    #
    # location = /login/ {
    #     allow YOUR_IP;
    #     deny all;
    #     include /etc/nginx/proxy_params;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location /admin/ {
    #     allow YOUR_IP;
    #     deny all;
    #     include /etc/nginx/proxy_params;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
